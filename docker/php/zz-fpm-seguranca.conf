; Endurecimento SÓ da aplicação web (pool "www" do PHP-FPM). Copiado pelo Dockerfile para
; /usr/local/etc/php-fpm.d/zz-seguranca.conf (carregado depois do www.conf/zz-docker.conf da imagem).
; Fica fora do zz-app.ini de propósito: lá valeria também para a linha de comando, e o composer
; (proc_open, download por URL) e os geradores ("composer controller X" roda via proc_open) quebrariam.
; php_admin_*: o código da aplicação não consegue desfazer com ini_set().

[www]
; Nada do app em FPM executa comandos/processos: busca feita em src/, core/ e public/ (só tools/build.php
; usa exec, e ele roda pela linha de comando, onde esta lista não vale).
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,show_source,highlight_file,symlink,link,posix_kill,posix_mkfifo

; Sem include/fopen de URL (http://, ftp://): file_get_contents($url) do usuário vira erro, não SSRF.
; (cURL continua disponível para chamadas HTTP feitas de propósito.)
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off

; O PHP só abre arquivos do projeto (/var/www/html: public/, src/, core/, vendor/, storage/ e o .env)
; e /tmp (uploads em curso, sessões, marcadores de aviso do log). storage/ e vendor/ ficam DENTRO da raiz.
; Se mudar session.save_path ou upload_tmp_dir para fora daqui, inclua a pasta nova.
php_admin_value[open_basedir] = /var/www/html:/tmp

; Logs da aplicação vão para o stderr do container (docker compose logs app). display_errors NÃO é
; fixado aqui: o public/index.php liga a exibição só com APP_DEBUG=true (padrão do zz-app.ini: desligado).
php_admin_flag[log_errors] = on
