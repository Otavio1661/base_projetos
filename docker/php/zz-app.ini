; Configuração do PHP para TODOS os SAPIs do container (php-fpm E linha de comando: composer, geradores,
; tools/*.php). O que só pode valer para a aplicação web (disable_functions, allow_url_fopen=Off,
; open_basedir) está em docker/php/zz-fpm-seguranca.conf (pool do PHP-FPM): aqui quebraria o composer
; (usa proc_open e baixa pacotes por URL) e os geradores rodados por "composer controller ...".

; Mitigação CVE-2026-115560 (sem correção oficial ainda)
session.upload_progress.enabled=0

expose_php=0
cgi.fix_pathinfo=0
allow_url_include=0

; Erros: sempre no log (stderr do container), nunca na tela. O public/index.php liga a exibição só com
; APP_DEBUG=true. zend.exception_ignore_args: stack traces sem valores de argumentos (senhas, chaves).
display_errors=0
display_startup_errors=0
log_errors=1
error_reporting=E_ALL & ~E_DEPRECATED
zend.exception_ignore_args=1

; Limites de entrada (alinhados com client_max_body_size 10m do nginx; Core\Security\Upload aplica
; o limite fino por rota). max_input_nesting_level limita a[b][c]... em $_POST/$_GET.
upload_max_filesize=8M
post_max_size=10M
max_file_uploads=10
max_input_vars=1000
max_input_nesting_level=32
max_input_time=30
memory_limit=128M

; Sessão (a aplicação só abre sessão quando precisa: Core\Security\Session::start(), que também
; ajusta Secure e o nome __Host-R4SID em HTTPS; estes são os padrões de segurança do PHP)
session.use_strict_mode=1
session.use_only_cookies=1
session.use_trans_sid=0
session.cookie_httponly=1
session.cookie_samesite=Lax

opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
