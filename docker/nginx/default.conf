# ------------------------------------------------------------------
# Content-Security-Policy por rota (ver docs/SEGURANCA.md, seção 7)
#  - default: só recursos da própria origem; nada de plugins (object-src 'none'), <base> preso,
#    formulários só para a própria origem, requisições (fetch/XHR) só para a própria origem.
#  - script-src 'self' SEM 'unsafe-inline': nenhuma página tem <script> inline. A chave PÚBLICA da
#    criptografia v2 vai numa <meta name="r4-server-key" content="{...}"> (public/index.php), que a
#    libr4 lê; o tema salvo da vitrine é aplicado por um script EXTERNO (/showcase/boot.js).
#    Código seu: nada de <script>...</script> nem onclick="..." — use arquivos .js e addEventListener.
#  - style-src 'unsafe-inline' (ainda necessário): a libr4 cria <style> em tempo de execução (tema,
#    variáveis --r4-*, tags declarativas) e os gráficos usam style="..." nos SVG; as páginas de erro
#    (public/erro404.php) têm <style> próprio. Injeção de CSS é bem menos grave que de script (não
#    executa código), mas pode vazar dados por seletores. Plano para eliminá-lo: tema via classes e
#    CSSOM (element.style / adoptedStyleSheets não são bloqueados pela CSP), SVG com atributos de
#    apresentação (fill=, stroke=) em vez de style=, CSS das páginas de erro em arquivo — aí trocar por
#    style-src 'self'.
#  - /vitrine (existe com APP_DEBUG=true ou VITRINE_PUBLICA=true; inclui /vitrine/testes): o playground
#    executa o código digitado → 'unsafe-eval' SÓ nessa rota.
# $request_uri é o original (vale também depois do try_files → /index.php).
# ------------------------------------------------------------------
map $request_uri $r4_csp {
    default             "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    "~^/(vitrine(/|\?|$)|\?|$)" "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
# Obs.: a rota "/" também abre a vitrine neste projeto, então ela recebe a MESMA CSP de /vitrine (com
# 'unsafe-eval', que o playground precisa para executar o código digitado). Quando "/" passar a ser a página
# da aplicação real, tire o "|\?|$" do padrão acima para a raiz voltar à CSP padrão (sem eval).

# ------------------------------------------------------------------
# Cache dos estáticos: o asset() do PHP versiona com ?v=<mtime>. Com ?v= a URL muda a cada alteração
# do arquivo → cache de 1 ano "immutable"; sem ?v= → 7 dias (revalida depois).
# ------------------------------------------------------------------
map $arg_v $r4_cache {
    default "public, max-age=604800";
    "~.+"   "public, max-age=31536000, immutable";
}

# Limite de requisições por IP (abuso/DoS simples): ~30 req/s com rajada de 100 (uma página da vitrine carrega ~40 arquivos).
limit_req_zone $binary_remote_addr zone=r4_geral:10m rate=30r/s;

server {
    limit_req zone=r4_geral burst=100 nodelay;
    limit_req_status 429;

    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;
    # Teto do corpo da requisição (o PHP ainda aplica os seus limites: getPost() 2 MB, API de teste
    # 1 MB, upload da vitrine 2 MB por arquivo). Acima disto o nginx responde 413 sem chamar o PHP.
    client_max_body_size 10m;
    client_body_timeout 30s;

    # Cabeçalhos de segurança
    # (nginx: um add_header dentro de um location ANULA os do server — por isso o bloco de
    #  estáticos abaixo repete todos; ao mexer aqui, mexa lá também)
    # Cross-Origin-Opener-Policy: same-origin  → janela aberta por outro site não fica com referência a esta
    # Cross-Origin-Resource-Policy: same-origin → outro site não embute nossos recursos (<script>/<img> de
    #   outra origem são bloqueados pelo navegador). Não afeta a própria origem (/r4/chave, fetch, estáticos
    #   da página). Não há CDN; se um dia outra origem PRECISAR carregar algo daqui (ex.: libr4.min.js num
    #   site parceiro), troque para "cross-origin" SÓ no location daquele arquivo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $r4_csp always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS: quem envia é o PHP (Core\Security\Transport), só em HTTPS com HTTPS_MODE=required
    # (HSTS_MAX_AGE / HSTS_SUBDOMAINS no .env). Não ligue aqui também, para não duplicar.

    # Compressão
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # Arquivos pré-comprimidos (libr4.min.js.gz ao lado do .js) — exige o módulo ngx_http_gzip_static_module.
    # A imagem oficial nginx:*-alpine costuma trazê-lo; confira com: nginx -V 2>&1 | grep -o gzip_static
    # e, se aparecer, descomente (sem o .gz no disco ele só cai no gzip normal acima):
    # gzip_static on;

    # Cache de descritores/metadados de arquivos (menos open()/stat() por requisição).
    # Atenção: por até open_file_cache_valid o nginx pode servir a versão ANTIGA de um arquivo trocado no
    # disco — e com ?v= novo isso ficaria guardado 1 ano no navegador. Depois de publicar arquivos novos,
    # recarregue o nginx (nginx -s reload, que limpa este cache). Em desenvolvimento com volume montado,
    # comente estas linhas se editar JS/CSS e recarregar a página em menos de 10 s.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 10s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Nunca servir arquivos ocultos (.env, .git, .htaccess...)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Uploads ficam em storage/ (FORA do root public/) e nunca são servidos direto. Se alguém copiar
    # storage/ ou uploads/ para dentro de public/ por engano, continua bloqueado.
    location ~* ^/(storage|uploads)(/|$) {
        deny all;
        return 404;
    }

    # Estáticos com cache (o asset() do projeto já versiona com ?v= → map $r4_cache lá em cima)
    # Sem "always" no Cache-Control: um 404 não fica guardado por 1 ano.
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control $r4_cache;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # um .svg aberto direto na aba não executa script nenhum
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self'" always;
        access_log off;
    }

    # /erp (mini ERP de demonstração): existe uma PASTA public/erp/ com os JS/CSS das telas; sem esta regra o
    # try_files abaixo trataria /erp como diretório (301 para /erp/). A página é do PHP (ErpController@app).
    # (rewrite + last: reprocessa a requisição em "location = /index.php", que executa no PHP-FPM. NÃO use
    #  try_files /index.php =404 aqui: com um arquivo existente no meio, o nginx o serve como estático.)
    location = /erp {
        rewrite ^ /index.php last;
    }

    # Front controller: tudo que não for arquivo vai para o index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Só o index.php é executado; qualquer outro .php vira 404
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # HTTPS terminado AQUI (bloco 443 abaixo): o PHP vê $_SERVER['HTTPS']=on. Em :80 fica vazio.
        fastcgi_param HTTPS $https if_not_empty;
        # (X-Forwarded-Proto/For chegam como HTTP_X_FORWARDED_*; o PHP só confia neles se REMOTE_ADDR
        #  estiver em TRUSTED_PROXIES no .env — ex.: o IP do Load Balancer na frente deste nginx)
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # esconde a versão do PHP
        fastcgi_hide_header X-Powered-By;
    }

    # (também .phtml/.phar/.php5... — nem executados nem servidos como texto)
    location ~* \.(php[0-9]?|phtml|phar|phps|pht|inc)$ {
        return 404;
    }
}

# ------------------------------------------------------------------
# EXEMPLO de produção com TLS neste nginx (comentado: o desenvolvimento continua em HTTP :80).
# Ver docs/PRODUCAO.md ("Cenários"). Com isto ligado use no .env: HTTPS_MODE=required.
#
# 1) Redireciono HTTP → HTTPS já no nginx (o PHP também faria: 308 em GET/HEAD, 426 em POST).
#    Se chamadas internas por HTTP precisarem passar (HTTP_PERMITIDO_PARA), NÃO use este
#    redirecionamento cego: deixe o server :80 acima atender e o PHP decidir por IP.
# server {
#     listen 80;
#     server_name exemplo.com www.exemplo.com;
#     location / { return 308 https://$host$request_uri; }
# }
#
# 2) Server HTTPS (copie os location/cabeçalhos do server :80 acima para dentro dele):
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name exemplo.com www.exemplo.com;
#     ssl_certificate     /etc/letsencrypt/live/exemplo.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/exemplo.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_session_timeout 1d;
#     ssl_session_cache shared:R4SSL:10m;
#     ssl_session_tickets off;
#     root /var/www/html/public;
#     # ... mesmos add_header, location ~ /\. , /storage, estáticos e location = /index.php
#     #     (com "fastcgi_param HTTPS $https if_not_empty;" o PHP enxerga o HTTPS) ...
# }
#
# 3) Atrás de um Load Balancer/proxy que termina o TLS e fala HTTP com este nginx:
#    - o LB precisa mandar X-Forwarded-Proto e X-Forwarded-For;
#    - no .env: TRUSTED_PROXIES=<IP ou CIDR do LB>  (só então o PHP acredita nesses cabeçalhos);
#    - se houver OUTRO nginx/proxy entre o LB e este, repasse os cabeçalhos do LB (não troque por
#      $scheme: entre o LB e ele a conexão é http) e liste os dois em TRUSTED_PROXIES:
#        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
#        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#        proxy_set_header Host              $host;
# ------------------------------------------------------------------
