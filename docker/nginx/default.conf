# ------------------------------------------------------------------
# Content-Security-Policy por rota (ver docs/SEGURANCA.md)
#  - default: só recursos da própria origem; nada de plugins (object-src 'none'), <base> preso,
#    formulários só para a própria origem, requisições (fetch/XHR) só para a própria origem.
#    script-src ainda precisa de 'unsafe-inline' porque o public/index.php injeta, em TODA página,
#    <script>window.BASE_CRIPTOGRAFIA = "...";</script>. Para CSP estrita troque 'unsafe-inline'
#    pelo hash desse script (ou passe a usar nonce no index.php):
#      printf '%s' 'window.BASE_CRIPTOGRAFIA = "SUA_CHAVE";' | openssl dgst -sha256 -binary | openssl base64
#      → script-src 'self' 'sha256-<resultado>'
#    (a vitrine tem mais um <script> inline: o que aplica o tema salvo antes de pintar a página)
#  - style-src 'unsafe-inline': a libr4 cria <style> (tema, tags) e usa style="..." nos gráficos.
#  - /vitrine (só existe com APP_DEBUG=true): o playground executa o código digitado → 'unsafe-eval'
#    SÓ nessa rota.
# $request_uri é o original (vale também depois do try_files → /index.php).
# ------------------------------------------------------------------
map $request_uri $r4_csp {
    default             "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    "~^/vitrine(/|\?|$)" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
# Obs.: a rota "/" também abre a vitrine em desenvolvimento, mas fica com a CSP padrão (sem
# 'unsafe-eval'), porque em produção "/" será a página da aplicação. Para o playground JS use /vitrine.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;
    # Teto do corpo da requisição (o PHP ainda aplica os seus limites: getPost() 2 MB, API de teste
    # 1 MB, upload da vitrine 2 MB por arquivo). Acima disto o nginx responde 413 sem chamar o PHP.
    client_max_body_size 10m;
    client_body_timeout 30s;

    # Cabeçalhos de segurança
    # (nginx: um add_header dentro de um location ANULA os do server — por isso o bloco de
    #  estáticos abaixo repete todos)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $r4_csp always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Só quando o site estiver atrás de HTTPS (no proxy/TLS na frente deste nginx):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compressão
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Nunca servir arquivos ocultos (.env, .git, .htaccess...)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Uploads ficam em storage/ (FORA do root public/) e nunca são servidos direto. Se alguém copiar
    # storage/ ou uploads/ para dentro de public/ por engano, continua bloqueado.
    location ~* ^/(storage|uploads)(/|$) {
        deny all;
        return 404;
    }

    # Estáticos com cache (o asset() do projeto já versiona com ?v=)
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # um .svg aberto direto na aba não executa script nenhum
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self'" always;
        access_log off;
    }

    # Front controller: tudo que não for arquivo vai para o index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Só o index.php é executado; qualquer outro .php vira 404
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # esconde a versão do PHP
        fastcgi_hide_header X-Powered-By;
    }

    # (também .phtml/.phar/.php5... — nem executados nem servidos como texto)
    location ~* \.(php[0-9]?|phtml|phar|phps|pht|inc)$ {
        return 404;
    }
}
