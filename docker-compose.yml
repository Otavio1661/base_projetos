services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor   # mantém o vendor instalado na imagem

  web:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8087}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

